<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Game - FinMaster</title>
    <link rel="stylesheet" href="quiz-rush.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .join-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 60px;
            text-align: center;
            margin: auto;
        }
        
        .join-header {
            margin-bottom: 40px;
        }
        
        .join-header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .join-header p {
            font-size: 20px;
            color: #666;
        }
        
        .join-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .form-group {
            text-align: left;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .room-code-input {
            font-size: 24px !important;
            font-weight: 700;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        .join-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .join-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .join-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: #ff635015;
            border: 1px solid #ff6350;
            color: #ff6350;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .waiting-to-join {
            display: none;
        }
        
        .waiting-to-join.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="screen active">
        <div class="join-container">
            <div class="join-header">
                <h1>⚡ Join Quiz Rush</h1>
                <p>Enter the room code to join the battle!</p>
            </div>
            
            <div id="join-form-container">
                <form id="join-form" class="join-form">
                    <div class="form-group">
                        <label for="room-code">Room Code</label>
                        <input 
                            type="text" 
                            id="room-code" 
                            class="room-code-input" 
                            placeholder="ABC123" 
                            maxlength="6"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="player-name">Your Name</label>
                        <input 
                            type="text" 
                            id="player-name" 
                            placeholder="Enter your name" 
                            required
                        >
                    </div>
                    
                    <div id="error-message" class="error-message"></div>
                    
                    <button type="submit" class="join-btn" id="join-btn">Join Game 🎮</button>
                </form>
            </div>
            
            <div id="waiting-to-join" class="waiting-to-join">
                <div class="spinner"></div>
                <h3>Joining game...</h3>
                <p>Please wait while we connect you</p>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const API_URL = `${window.location.origin}/api`;
        let socket = null;
        
        // Get room code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomCodeFromUrl = urlParams.get('room');
        
        if (roomCodeFromUrl) {
            document.getElementById('room-code').value = roomCodeFromUrl;
        }
        
        // Connect to Socket.IO
        socket = io(window.location.origin);
        
        socket.on('connect', () => {
            console.log('Connected to Socket.IO');
        });
        
        // Handle form submission
        document.getElementById('join-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const roomCode = document.getElementById('room-code').value.toUpperCase().trim();
            const playerName = document.getElementById('player-name').value.trim();
            
            if (!roomCode || !playerName) {
                showError('Please fill in all fields');
                return;
            }
            
            // Show loading
            document.getElementById('join-form-container').style.display = 'none';
            document.getElementById('waiting-to-join').classList.add('show');
            
            try {
                const response = await fetch(`${API_URL}/quizrush/join-room-guest`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ roomCode, playerName })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to join room');
                }
                
                const data = await response.json();
                
                // Store guest session
                sessionStorage.setItem('guestName', playerName);
                sessionStorage.setItem('gameId', data.gameId);
                sessionStorage.setItem('roomCode', roomCode);
                
                // Redirect immediately to quiz-rush page
                // The quiz-rush.js will handle joining the socket room
                window.location.href = '/quiz-rush.html';
                
            } catch (error) {
                console.error('Error joining room:', error);
                showError(error.message || 'Failed to join room. Please check the room code.');
                
                // Show form again
                document.getElementById('join-form-container').style.display = 'block';
                document.getElementById('waiting-to-join').classList.remove('show');
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
        
        // Auto-uppercase room code
        document.getElementById('room-code').addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });
    </script>
</body>
</html>
